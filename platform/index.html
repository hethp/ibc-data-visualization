<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>IBC Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0f1f3d;
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --cream: #f8f5ef;
      --muted: #8a94a8;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(201,168,76,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(201,168,76,0.07) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 4px;
      padding: 52px;
      width: 480px;
      backdrop-filter: blur(12px);
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 44px;
    }

    .logo-mark {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--gold);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 13px;
      color: var(--navy);
      font-weight: 600;
    }

    .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      color: var(--cream);
    }

    .logout-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: var(--muted);
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 3px;
      padding: 6px 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .logout-btn:hover { color: var(--cream); border-color: rgba(255,255,255,0.25); }

    .welcome-label {
      font-size: 12px;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 500;
      margin-bottom: 6px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      color: var(--cream);
      font-weight: 600;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: var(--gold);
      margin: 24px 0;
    }

    .nav-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      background: transparent;
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: 3px;
      color: var(--cream);
      text-decoration: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .nav-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(201,168,76,0.05);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .nav-btn:hover { border-color: rgba(201,168,76,0.5); color: var(--gold-light); }
    .nav-btn:hover::before { opacity: 1; }
    .nav-btn:hover .arrow { transform: translateX(4px); }

    .arrow {
      font-size: 18px;
      color: var(--gold);
      transition: transform 0.2s ease;
    }

    .nav-btn-content { display: flex; flex-direction: column; }

    .nav-btn-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-bar">
      <div class="logo-mark">
        <div class="logo-icon">IBC</div>
        <span class="logo-text">Illinois Business Consulting</span>
      </div>
      <button class="logout-btn" id="logoutBtn">Sign out</button>
    </div>

    <div class="welcome-label">Welcome back</div>
    <h1 id="userName">Member</h1>
    <div class="divider"></div>

    <nav class="nav-grid">
      <a class="nav-btn" href="LINK HERE" target="_blank">
        <div class="nav-btn-content">
          <span>Data Visualization</span>
          <span class="nav-btn-label">Analytics & reporting</span>
        </div>
        <span class="arrow">→</span>
      </a>

      <a class="nav-btn" href="https://paul-frontend-1028092455458.us-central1.run.app" target="_blank">
        <div class="nav-btn-content">
          <span>Paul Dashboard</span>
          <span class="nav-btn-label">Client management</span>
        </div>
        <span class="arrow">→</span>
      </a>

      <a class="nav-btn" href="http://34.58.210.236:3000/" target="_blank">
        <div class="nav-btn-content">
          <span>Staffing Tool</span>
          <span class="nav-btn-label">Team & project staffing</span>
        </div>
        <span class="arrow">→</span>
      </a>
    </nav>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const tokenFromUrl = urlParams.get('token');

    if (tokenFromUrl) {
      localStorage.setItem('ibc_jwt', tokenFromUrl);
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    const token = localStorage.getItem('ibc_jwt');

    if (!token) {
      window.location.href = 'login.html';
    } else {
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        if (payload.exp && Date.now() / 1000 > payload.exp) {
          localStorage.removeItem('ibc_jwt');
          window.location.href = 'login.html';
        }
        const display = payload.name || payload.email || 'Member';
        // Name from Azure is "LastName, FirstName" — extract first name
        document.getElementById('userName').textContent =
          display.includes(',') ? display.split(',')[1].trim() : display.split(' ')[0];
      } catch (e) {
        localStorage.removeItem('ibc_jwt');
        window.location.href = 'login.html';
      }
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('ibc_jwt');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
